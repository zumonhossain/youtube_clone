
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Website{% endblock %}</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
        }

        /* Top Header: 8% height */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 8vh;
            background-color: white;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #ddd;
            z-index: 1000;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ff0000;
        }

        .search-box {
            margin: auto;
            width: 40%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 20px;
        }

        /* Left Sidebar: 10% width */
        .sidebar {
            position: fixed;
            top: 8vh;
            left: 0;
            width: 10%;
            height: 92vh;
            background-color: white;
            border-right: 1px solid #ddd;
            padding: 20px 10px;
        }

        .sidebar a {
            display: block;
            text-decoration: none;
            color: #333;
            padding: 12px 5px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .sidebar a:hover {
            background-color: #eaeaea;
        }

        /* Dynamic Content: remaining page */
        .main-content {
            margin-top: 8vh;
            margin-left: 10%;
            width: 90%;
            min-height: 92vh;
            padding: 25px;
        }

        /* Responsive layout */
        @media (max-width: 768px) {
            .sidebar {
                width: 65px;
                padding: 10px 5px;
            }

            .sidebar a {
                font-size: 10px;
                text-align: center;
            }

            .main-content {
                margin-left: 65px;
                width: calc(100% - 65px);
                padding: 15px;
            }

            .search-box {
                width: 45%;
            }
        }
    </style>
</head>

<body>

    <!-- Top Header -->
    <header class="header">
        <div class="logo">MyTube</div>

        <input
            type="search"
            class="search-box"
            placeholder="Search..."
            aria-label="Search"
        >
    </header>

    <!-- Left Sidebar -->
    <aside class="sidebar">
        <a href="/">🏠 Home</a>
        <a href="/videos/">🎬 Videos</a>
        <a href="/subscriptions/">📺 Subscriptions</a>
        <a href="/history/">🕒 History</a>
        <a href="/settings/">⚙️ Settings</a>
    </aside>

    <!-- Dynamic Content -->
    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
